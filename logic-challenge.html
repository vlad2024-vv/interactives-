
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Python Random — 12 випробувань для мозку</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #f1f5f9;
    background:
        radial-gradient(circle at 15% 15%, #164e63 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #312e81 0, transparent 35%),
        #071426;
    padding: 25px 15px;
}

.container {
    max-width: 850px;
    margin: 0 auto;
}

header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 48px;
    margin-bottom: 10px;
}

h1 {
    font-size: clamp(27px, 5vw, 42px);
    margin: 0 0 12px;
    color: #67e8f9;
}

.subtitle {
    color: #cbd5e1;
    font-size: 17px;
    line-height: 1.5;
}

.game {
    background: rgba(15, 31, 53, 0.95);
    border: 1px solid rgba(103, 232, 249, 0.2);
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}

.top-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    color: #a5f3fc;
    font-weight: bold;
    margin-bottom: 18px;
}

.progress-bg {
    height: 10px;
    background: #26374d;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 28px;
}

.progress {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #06b6d4, #818cf8);
    transition: width 0.3s;
}

.category {
    display: inline-block;
    background: #164e63;
    color: #a5f3fc;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 15px;
}

.question {
    font-size: 23px;
    line-height: 1.45;
    font-weight: bold;
    margin-bottom: 20px;
}

.code {
    display: none;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 18px;
    margin: 18px 0;
    overflow-x: auto;
    white-space: pre;
    font-family: Consolas, monospace;
    font-size: 15px;
    line-height: 1.6;
    color: #a5f3fc;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 16px 18px;
    text-align: left;
    font-size: 17px;
    color: #e2e8f0;
    background: #1e334e;
    border: 2px solid #344b68;
    border-radius: 13px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    border-color: #67e8f9;
    background: #254765;
    transform: translateY(-2px);
}

.answer:disabled {
    cursor: default;
}

.answer.correct {
    background: #14532d;
    border-color: #4ade80;
}

.answer.wrong {
    background: #7f1d1d;
    border-color: #f87171;
}

.feedback {
    display: none;
    margin-top: 22px;
    padding: 18px;
    border-radius: 13px;
    background: #172f49;
    border-left: 4px solid #67e8f9;
    line-height: 1.6;
    font-size: 16px;
}

.feedback strong {
    color: #67e8f9;
}

.next-btn, .restart-btn {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(90deg, #0891b2, #4f46e5);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.next-btn:hover, .restart-btn:hover {
    filter: brightness(1.15);
    transform: translateY(-2px);
}

.next-btn {
    display: none;
}

.result {
    display: none;
    text-align: center;
}

.result-emoji {
    font-size: 75px;
    margin: 10px 0;
}

.result h2 {
    color: #67e8f9;
    font-size: 30px;
}

.score {
    font-size: 35px;
    font-weight: bold;
    color: #fde68a;
    margin: 20px 0;
}

.result-text {
    color: #cbd5e1;
    font-size: 18px;
    line-height: 1.6;
}

footer {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    padding: 25px 10px;
}

@media (max-width: 600px) {
    .game {
        padding: 20px 16px;
    }

    .question {
        font-size: 20px;
    }

    .answer {
        font-size: 16px;
    }

    .code {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">🐍🎲</div>
    <h1>Python Random</h1>
    <div class="subtitle">
        12 випробувань для мозку!<br>
        Випадковість, розгалуження і трохи програмного гумору 😎
    </div>
</header>

<div class="game">

    <div id="quiz">

        <div class="top-info">
            <span id="questionNumber">Запитання 1 із 12</span>
            <span id="score">⭐ Бали: 0</span>
        </div>

        <div class="progress-bg">
            <div class="progress" id="progress"></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div class="code" id="code"></div>

        <div class="answers" id="answers"></div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            Наступне випробування →
        </button>

    </div>

    <div class="result" id="result">
        <div class="result-emoji" id="resultEmoji"></div>
        <h2 id="resultTitle"></h2>
        <div class="score" id="finalScore"></div>
        <div class="result-text" id="resultText"></div>

        <button class="restart-btn" onclick="startGame()">
            🔄 Спробувати ще раз
        </button>
    </div>

</div>

<footer>
    Кабінет інформатики · Python Random
</footer>

</div>

<script>

const questions = [

{
    category: "🎲 Модуль random",
    q: "Яка команда підключає модуль random до програми?",
    code: "",
    a: [
        {t: "include random", c: false},
        {t: "import random", c: true},
        {t: "random import", c: false},
        {t: "from random", c: false}
    ],
    why: "Правильна команда — import random. Спочатку підключаємо модуль, а вже потім користуємося його можливостями. Без цього random образиться і не працюватиме! 😁"
},

{
    category: "🎲 random.randint()",
    q: "Що робить команда random.randint(1, 6)?",
    code: "import random\nnumber = random.randint(1, 6)\nprint(number)",
    a: [
        {t: "Створює випадкове ціле число від 1 до 6 включно", c: true},
        {t: "Створює число від 1 до 5", c: false},
        {t: "Вибирає випадкове слово", c: false},
        {t: "Завжди повертає число 6", c: false}
    ],
    why: "randint() повертає випадкове ціле число. Обидві межі включаються: 1, 2, 3, 4, 5 або 6. Фактично це наш цифровий гральний кубик! 🎲"
},

{
    category: "🎲 random.randint()",
    q: "Яке число НЕ може отримати змінна number?",
    code: "import random\nnumber = random.randint(5, 10)",
    a: [
        {t: "5", c: false},
        {t: "7", c: false},
        {t: "10", c: false},
        {t: "11", c: true}
    ],
    why: "Можливі числа від 5 до 10 включно. Число 11 не входить у діапазон. Його навіть на вечірку не запросили!"
},

{
    category: "🎲 random.randint()",
    q: "Який діапазон може повернути ця команда?",
    code: "temperature = random.randint(-5, 10)",
    a: [
        {t: "Від -5 до 10 включно", c: true},
        {t: "Від 0 до 10", c: false},
        {t: "Від -5 до 9", c: false},
        {t: "Лише додатні числа", c: false}
    ],
    why: "randint() працює і з від'ємними числами. Можливі результати: -5, -4, ... 0, ... 9, 10. Навіть мороз може бути випадковим! ❄️"
},

{
    category: "🎯 random.choice()",
    q: "Для чого використовують random.choice()?",
    code: "animals = ['кіт', 'пес', 'папуга', 'хом’як']\nanimal = random.choice(animals)",
    a: [
        {t: "Для випадкового вибору одного елемента", c: true},
        {t: "Для сортування списку", c: false},
        {t: "Для видалення елемента", c: false},
        {t: "Для створення нового списку", c: false}
    ],
    why: "choice() випадково обирає один елемент із послідовності. Сьогодні це може бути кіт, а завтра папуга. Тварини самі не знають, кому пощастить! 🐈"
},

{
    category: "🎯 random.choice()",
    q: "Яке значення може отримати змінна gift?",
    code: "import random\ngifts = ['книга', 'м’яч', 'навушники']\ngift = random.choice(gifts)",
    a: [
        {t: "книга", c: true},
        {t: "телефон", c: false},
        {t: "комп’ютер", c: false},
        {t: "велосипед", c: false}
    ],
    why: "Програма може вибрати тільки те, що є у списку: книгу, м'яч або навушники. Телефон у списку не прописаний — доведеться заробити окремо! 😁"
},

{
    category: "🎯 random.choice()",
    q: "Що може отримати змінна letter?",
    code: "import random\nletter = random.choice('ПРОГРАМУВАННЯ')",
    a: [
        {t: "Один випадковий символ із рядка", c: true},
        {t: "Увесь рядок", c: false},
        {t: "Випадкове число", c: false},
        {t: "Список символів", c: false}
    ],
    why: "choice() може працювати не лише зі списком, а й із рядком. У результаті отримуємо один випадковий символ. Літери теж можуть грати в лотерею!"
},

{
    category: "🔀 Розгалуження",
    q: "Яке повідомлення буде виведено, якщо number дорівнює 8?",
    code: "number = 8\n\nif number > 5:\n    print('Велике число')\nelse:\n    print('Мале число')",
    a: [
        {t: "Велике число", c: true},
        {t: "Мале число", c: false},
        {t: "Обидва повідомлення", c: false},
        {t: "Нічого не виведеться", c: false}
    ],
    why: "8 більше за 5, тому умова if істинна. Виконується перший блок. Програма не сумнівається — усе чітко!"
},

{
    category: "🔀 Розгалуження",
    q: "Яке повідомлення виведе програма, якщо number = 5?",
    code: "number = 5\n\nif number > 5:\n    print('Більше')\nelif number < 5:\n    print('Менше')\nelse:\n    print('Рівно п’ять')",
    a: [
        {t: "Більше", c: false},
        {t: "Менше", c: false},
        {t: "Рівно п’ять", c: true},
        {t: "Усі три повідомлення", c: false}
    ],
    why: "Число 5 не більше і не менше за 5. Обидві умови хибні, тому виконується else. Нарешті число, яке ні з ким не сперечається!"
},

{
    category: "🔀 Розгалуження",
    q: "Яке слово використовують для перевірки додаткової умови?",
    code: "if points >= 90:\n    print('Відмінно')\nelif points >= 60:\n    print('Добре')\nelse:\n    print('Потрібно потренуватися')",
    a: [
        {t: "elif", c: true},
        {t: "repeat", c: false},
        {t: "random", c: false},
        {t: "input", c: false}
    ],
    why: "elif перевіряє додаткову умову, якщо попередня умова if не виконалася. Це ще один шлях для програми. Як запасний вихід, тільки розумний!"
},

{
    category: "🎲 + 🔀 Разом",
    q: "Що може вивести програма під час запуску?",
    code: "import random\nnumber = random.randint(1, 10)\n\nif number > 5:\n    print('Велике число')\nelif number < 5:\n    print('Мале число')\nelse:\n    print('П’ятірка!')",
    a: [
        {t: "Велике число, мале число або П’ятірка!", c: true},
        {t: "Тільки велике число", c: false},
        {t: "Тільки мале число", c: false},
        {t: "Завжди П’ятірка!", c: false}
    ],
    why: "Спочатку randint() створює число від 1 до 10. Потім if, elif та else визначають, яке повідомлення показати. Випадковість отримала роботу, а розгалуження — керівну посаду!"
},

{
    category: "🏆 Фінальний челендж",
    q: "Яке повідомлення буде виведено, якщо випадково випало число 6?",
    code: "import random\nnumber = random.randint(1, 6)\n\nif number == 6:\n    print('Перемога!')\nelse:\n    print('Спробуй ще!')",
    a: [
        {t: "Перемога!", c: true},
        {t: "Спробуй ще!", c: false},
        {t: "Обидва повідомлення", c: false},
        {t: "Помилка програми", c: false}
    ],
    why: "6 дорівнює 6, тому умова number == 6 істинна. Програма виведе «Перемога!». Ось це удача! 🏆"
}

];

let gameQuestions = [];
let current = 0;
let points = 0;
let answered = false;

function shuffle(array) {
    let result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function startGame() {
    gameQuestions = shuffle(questions).map(item => ({
        ...item,
        a: shuffle(item.a)
    }));

    current = 0;
    points = 0;
    answered = false;

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    showQuestion();
}

function showQuestion() {
    answered = false;

    let item = gameQuestions[current];

    document.getElementById("questionNumber").textContent =
        "Запитання " + (current + 1) + " із 12";

    document.getElementById("score").textContent =
        "⭐ Бали: " + points;

    document.getElementById("progress").style.width =
        (current / 12 * 100) + "%";

    document.getElementById("category").textContent = item.category;
    document.getElementById("question").textContent = item.q;

    let code = document.getElementById("code");

    if (item.code) {
        code.textContent = item.code;
        code.style.display = "block";
    } else {
        code.style.display = "none";
    }

    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    let answers = document.getElementById("answers");
    answers.innerHTML = "";

    item.a.forEach((answer, index) => {
        let button = document.createElement("button");

        button.className = "answer";
        button.textContent =
            String.fromCharCode(65 + index) + ") " + answer.t;

        button.onclick = () => checkAnswer(index);

        answers.appendChild(button);
    });
}

function checkAnswer(index) {
    if (answered) return;

    answered = true;

    let item = gameQuestions[current];
    let buttons = document.querySelectorAll(".answer");
    let correctIndex = item.a.findIndex(answer => answer.c);

    if (item.a[index].c) {
        points++;
    }

    buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === correctIndex) {
            button.classList.add("correct");
        }

        if (i === index && !item.a[index].c) {
            button.classList.add("wrong");
        }
    });

    document.getElementById("score").textContent =
        "⭐ Бали: " + points;

    let feedback = document.getElementById("feedback");

    if (item.a[index].c) {
        feedback.innerHTML =
            "<strong>🎉 Правильно! Python тобі аплодує!</strong><br><br>" +
            item.why;
    } else {
        feedback.innerHTML =
            "<strong>😅 Не цього разу! Але тепер ти знаєш більше.</strong><br><br>" +
            item.why;
    }

    feedback.style.display = "block";

    let nextBtn = document.getElementById("nextBtn");

    nextBtn.textContent =
        current === 11 ? "Побачити результат 🏆" : "Наступне випробування →";

    nextBtn.style.display = "block";
}

function nextQuestion() {
    current++;

    if (current < 12) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("progress").style.width = "100%";

    document.getElementById("finalScore").textContent =
        points + " / 12 балів";

    let emoji, title, message;

    if (points === 12) {
        emoji = "👑";
        title = "Python-легенда!";
        message = "12 із 12! Ти повністю приборкав випадковість і розгалуження. Можливо, саме ти написав Python? Не забудь розповісти творцям мови!";
    } else if (points >= 10) {
        emoji = "🐍";
        title = "Майстер Python!";
        message = "Чудовий результат! randint(), choice() та розгалуження тобі добре знайомі. Ще трохи — і комп'ютер сам проситиме в тебе поради!";
    } else if (points >= 7) {
        emoji = "😎";
        title = "Python-бешкетник!";
        message = "Дуже непогано! Ти вже вмієш керувати випадковістю. Але кілька запитань усе-таки змогли тебе здивувати.";
    } else if (points >= 4) {
        emoji = "🤔";
        title = "Кодер на розминці!";
        message = "Є над чим попрацювати. Повтори randint(), choice() та if / elif / else. Python нікуди не втече!";
    } else {
        emoji = "😂";
        title = "Random переміг!";
        message = "Сьогодні випадковість була сильнішою. Не біда! Переглянь матеріал уроку та спробуй ще раз. Навіть найкращі програмісти колись починали!";
    }

    document.getElementById("resultEmoji").textContent = emoji;
    document.getElementById("resultTitle").textContent = title;
    document.getElementById("resultText").textContent = message;
}

startGame();

</script>

</body>
</html>
